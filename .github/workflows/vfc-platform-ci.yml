name: VFC SaaS Build
on:
  push:
    branches: [feature/vfc-platform]
    paths: ['vfc-platform/**', '.github/workflows/vfc-platform-ci.yml']
  pull_request:
    paths: ['vfc-platform/**']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vfc-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wyejyzxecvvspdruryzh.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-test-publishable-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
